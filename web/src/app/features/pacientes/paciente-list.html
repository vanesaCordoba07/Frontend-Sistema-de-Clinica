<div class="page-head">
    <h1>Pacientes</h1>
    <button mat-flat-button color="primary" type="button" (click)="nuevo()">
        <mat-icon>add</mat-icon>
        Nuevo
    </button>
</div>

@if (loading) {
<div class="loading">
    <mat-spinner />
</div>
} @else {
<div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource">
        <ng-container matColumnDef="id_usuario">
            <th mat-header-cell *matHeaderCellDef>Usuario (id)</th>
            <td mat-cell *matCellDef="let r">{{ shortId(r.id_usuario) }}</td>
        </ng-container>

        <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef>Nombre</th>
            <td mat-cell *matCellDef="let r">{{ r.nombre }}</td>
        </ng-container>

        <ng-container matColumnDef="telefono">
            <th mat-header-cell *matHeaderCellDef>Teléfono</th>
            <td mat-cell *matCellDef="let r">{{ r.telefono }}</td>
        </ng-container>

        <ng-container matColumnDef="fecha_nacimiento">
            <th mat-header-cell *matHeaderCellDef>Fecha Nacimiento</th>
            <td mat-cell *matCellDef="let r">
                {{ r.fecha_nacimiento | date: 'shortDate' }}
            </td>
        </ng-container>

        <ng-container matColumnDef="direccion">
            <th mat-header-cell *matHeaderCellDef>Dirección</th>
            <td mat-cell *matCellDef="let r">{{ r.direccion }}</td>
        </ng-container>

        <ng-container matColumnDef="genero">
            <th mat-header-cell *matHeaderCellDef>Género</th>
            <td mat-cell *matCellDef="let r">{{ r.genero }}</td>
        </ng-container>

        <ng-container matColumnDef="tipo_afiliacion">
            <th mat-header-cell *matHeaderCellDef>Tipo Afiliación</th>
            <td mat-cell *matCellDef="let r">{{ r.tipo_afiliacion }}</td>
        </ng-container>

        <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let r" class="actions">
                <button mat-icon-button type="button" (click)="editar(r)" aria-label="Editar">
                    <mat-icon>edit</mat-icon>
                </button>

                <button mat-icon-button type="button" (click)="eliminar(r)" aria-label="Eliminar">
                    <mat-icon>delete</mat-icon>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons />
</div>
}
