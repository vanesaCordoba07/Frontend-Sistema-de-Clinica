<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Nuevo historial' : 'Editar historial' }}</h2>
<mat-dialog-content class="dialog-body">
  <form [formGroup]="form" class="grid">
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Cita</mat-label>
      <mat-select formControlName="id_cita">
        @for (c of citas(); track c.id_cita) {
          <mat-option [value]="c.id_cita">{{ c.motivo }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Enfermero</mat-label>
      <mat-select formControlName="id_enfermero">
        @for (e of enfermeros(); track e.id_enfermero) {
          <mat-option [value]="e.id_enfermero">{{ e.nombre }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Diagnostico</mat-label>
      <input matInput formControlName="diagnostico" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Observaciones medicas</mat-label>
      <textarea matInput rows="3" formControlName="observaciones_medicas"></textarea>
    </mat-form-field>
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Indicaciones enfermeria</mat-label>
      <textarea matInput rows="3" formControlName="indicaciones_enfermeria"></textarea>
    </mat-form-field>
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Observaciones enfermeria</mat-label>
      <textarea matInput rows="3" formControlName="observaciones_enfermeria"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" type="button" (click)="save()">Guardar</button>
</mat-dialog-actions>
