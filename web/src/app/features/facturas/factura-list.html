<div class="page-head">
    <h1>Facturas</h1>
    <button mat-flat-button color="primary" type="button" (click)="nuevo()">
        <mat-icon>add</mat-icon>
        Nueva Factura
    </button>
</div>

@if (loading) {
<div class="loading">
    <mat-spinner />
</div>
} @else {
<div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource">

        <ng-container matColumnDef="id_cita">
            <th mat-header-cell *matHeaderCellDef>Cita (id)</th>
            <td mat-cell *matCellDef="let r">{{ shortId(r.id_cita) }}</td>
        </ng-container>

        <ng-container matColumnDef="total">
            <th mat-header-cell *matHeaderCellDef>Total</th>
            <td mat-cell *matCellDef="let r">{{ r.total }}</td>
        </ng-container>

        <ng-container matColumnDef="metodo_pago">
            <th mat-header-cell *matHeaderCellDef>Método de Pago</th>
            <td mat-cell *matCellDef="let r">{{ r.metodo_pago }}</td>
        </ng-container>

        <ng-container matColumnDef="estado_pago">
            <th mat-header-cell *matHeaderCellDef>Estado de Pago</th>
            <td mat-cell *matCellDef="let r">{{ r.estado_pago }}</td>
        </ng-container>

        <ng-container matColumnDef="fecha_pago">
            <th mat-header-cell *matHeaderCellDef>Fecha de Pago</th>
            <td mat-cell *matCellDef="let r">{{ r.fecha_pago | date: 'short' }}</td>
        </ng-container>

        <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let r" class="actions">
                <button mat-icon-button type="button" (click)="editar(r)" aria-label="Editar">
                    <mat-icon>edit</mat-icon>
                </button>

                <button mat-icon-button type="button" (click)="eliminar(r)" aria-label="Eliminar">
                    <mat-icon>delete</mat-icon>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons />
</div>
}
