<h2 mat-dialog-title>
    {{ data.mode === 'create' ? 'Nuevo Tratamiento' : 'Editar Tratamiento' }}
</h2>

<mat-dialog-content class="dialog-body">
    <form [formGroup]="form" class="grid">


        <mat-form-field appearance="outline" class="span-2">
            <mat-label>Historial</mat-label>
            <input matInput formControlName="id_historial" />
            <mat-error *ngIf="form.get('id_historial')?.hasError('required')">
                El historial es obligatorio
            </mat-error>
        </mat-form-field>


        <mat-form-field appearance="outline" class="span-2">
            <mat-label>Nombre del tratamiento</mat-label>
            <input matInput formControlName="nombre_tratamiento" />
            <mat-error *ngIf="form.get('nombre_tratamiento')?.hasError('required')">
                El nombre es obligatorio
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="span-2">
            <mat-label>Descripción</mat-label>
            <textarea matInput rows="3" formControlName="descripcion"></textarea>
        </mat-form-field>

        <mat-form-field appearance="outline" class="span-2">
            <mat-label>Dosis</mat-label>
            <textarea matInput rows="2" formControlName="dosis"></textarea>
            <mat-error *ngIf="form.get('dosis')?.hasError('required')">
                La dosis es obligatoria
            </mat-error>
        </mat-form-field>


        <mat-form-field appearance="outline" class="span-2">
            <mat-label>Duración (días)</mat-label>
            <input matInput type="number" formControlName="duracion" />
            <mat-error *ngIf="form.get('duracion')?.hasError('required')">
                La duración es obligatoria
            </mat-error>
        </mat-form-field>

    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancelar</button>

    <button mat-flat-button color="primary" (click)="save()" [disabled]="form.invalid">
        {{ data.mode === 'create' ? 'Guardar' : 'Actualizar' }}
    </button>
</mat-dialog-actions>
