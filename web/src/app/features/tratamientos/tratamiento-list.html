<div class="page-head">
    <h1>Tratamientos</h1>
    <button mat-flat-button color="primary" type="button" (click)="nuevo()">
        <mat-icon>add</mat-icon>
        Nuevo
    </button>
</div>

@if (loading) {
<div class="loading">
    <mat-spinner />
</div>
} @else {
<div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource">

        <ng-container matColumnDef="nombre_tratamiento">
            <th mat-header-cell *matHeaderCellDef>Nombre</th>
            <td mat-cell *matCellDef="let r">{{ r.nombre_tratamiento }}</td>
        </ng-container>

        <ng-container matColumnDef="descripcion">
            <th mat-header-cell *matHeaderCellDef>Descripción</th>
            <td mat-cell *matCellDef="let r">{{ r.descripcion }}</td>
        </ng-container>

        <ng-container matColumnDef="dosis">
            <th mat-header-cell *matHeaderCellDef>Dosis</th>
            <td mat-cell *matCellDef="let r">{{ r.dosis }}</td>
        </ng-container>

        <ng-container matColumnDef="duracion">
            <th mat-header-cell *matHeaderCellDef>Duración</th>
            <td mat-cell *matCellDef="let r">{{ r.duracion }}</td>
        </ng-container>

        <ng-container matColumnDef="id_historial">
            <th mat-header-cell *matHeaderCellDef>Historial (id)</th>
            <td mat-cell *matCellDef="let r">{{ shortId(r.id_historial) }}</td>
        </ng-container>

        <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let r" class="actions">
                <button mat-icon-button type="button" (click)="editar(r)" aria-label="Editar">
                    <mat-icon>edit</mat-icon>
                </button>

                <button mat-icon-button type="button" (click)="eliminar(r)" aria-label="Eliminar">
                    <mat-icon>delete</mat-icon>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons />
</div>
}
