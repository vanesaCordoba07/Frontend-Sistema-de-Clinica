<div class="login-page">
  <mat-card class="login-card" appearance="outlined">
    <mat-card-header>
      <h2>Registro de usuario</h2>
    </mat-card-header>

    <mat-card-content>

      @if (loading()) {
      <div class="center">
        <mat-spinner diameter="40"></mat-spinner>
      </div>

      } @else {

      <!-- FORMULARIO CREAR USUARIO -->
      <form [formGroup]="firstUserForm" (ngSubmit)="crearPrimero()" class="form-grid">

        <mat-form-field appearance="outline">
          <mat-label>Nombre completo</mat-label>
          <input matInput formControlName="nombre_completo" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="span-2">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" formControlName="clave" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Rol</mat-label>
          <input matInput formControlName="rol" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Estado</mat-label>
          <input matInput formControlName="estado" />
        </mat-form-field>

        <div class="span-2 actions">
          <button mat-flat-button color="primary" type="submit">
            Crear y entrar
          </button>
        </div>

      </form>

      <hr>

      } @if (usuarios().length > 0) {

      <!-- FORMULARIO LOGIN -->
      <h2>Ingresar</h2>
      <form [formGroup]="loginForm" (ngSubmit)="ingresar()" class="login-form">

        <mat-form-field appearance="outline" class="full">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" autocomplete="username" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" formControlName="clave" />
        </mat-form-field>

        <button mat-flat-button color="primary" type="submit" class="submit-btn">
          Ingresar
        </button>

      </form>

      }

    </mat-card-content>
  </mat-card>
</div>
